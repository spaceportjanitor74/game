<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="theme-color" content="#0a0010" />
  <title>The Gauntlet</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0010;
      display:flex; align-items:center; justify-content:center;
      font-family:'Georgia',serif; touch-action:none;
      overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
    canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges;
      image-rendering:-moz-crisp-edges; touch-action:none; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(function(){
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const LW = 480, LH = 640;
let scale = 1;
const isMobile = ('ontouchstart' in window) || window.matchMedia('(pointer:coarse)').matches;
function resize(){
  const vp = window.visualViewport;
  const vw = vp ? vp.width  : window.innerWidth;
  const vh = vp ? vp.height : window.innerHeight;
  scale = Math.min(vw/LW, vh/LH);
  canvas.width  = Math.round(LW*scale);
  canvas.height = Math.round(LH*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize', resize);
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('contextmenu', e=>e.preventDefault());
resize();

/* ── PROCEDURAL ART KIT ──────────────────────────────────────── */
// The entire world is drawn in code — flat layered silhouettes over
// atmospheric gradient skies, with glow accents. No image assets.
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function noise1(x){
  const i=Math.floor(x), f=x-i, u=(1-Math.cos(f*Math.PI))/2;
  return hash(i)*(1-u)+hash(i+1)*u;
}
function skyGrad(stops){
  const g=ctx.createLinearGradient(0,0,0,LH-GROUND_H);
  for(const [p,c] of stops) g.addColorStop(p,c);
  ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH-GROUND_H);
}
// Rolling silhouette ridge, world-anchored so it scrolls seamlessly
function ridge(depth,baseY,amp,freq,col,seed){
  const off=worldX*depth;
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-3,LH);
  for(let x=-3;x<=LW+3;x+=8){
    const wx=(x+off)*freq+seed*37.7;
    ctx.lineTo(x,baseY-(noise1(wx)*0.72+noise1(wx*2.7+5)*0.28)*amp);
  }
  ctx.lineTo(LW+3,LH); ctx.closePath(); ctx.fill();
}
// Same, hanging from the ceiling
function ceilRidge(depth,baseY,amp,freq,col,seed){
  const off=worldX*depth;
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-3,-3);
  for(let x=-3;x<=LW+3;x+=8){
    const wx=(x+off)*freq+seed*37.7;
    ctx.lineTo(x,baseY+(noise1(wx)*0.72+noise1(wx*2.7+5)*0.28)*amp);
  }
  ctx.lineTo(LW+3,-3); ctx.closePath(); ctx.fill();
}
// World-anchored repeating decorations: fn(screenX, 0..1 variation)
function row(depth,spacing,seed,fn){
  const off=worldX*depth, first=Math.floor(off/spacing)-1;
  for(let i=first;i*spacing-off<LW+spacing;i++) fn(i*spacing-off,hash(i*13.37+seed));
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function cloud(x,y,r,col){
  ctx.fillStyle=col;
  for(const [dx,dy,dr] of [[0,-0.1,0.62],[-0.85,0.16,0.45],[0.85,0.18,0.5],[0,0.3,0.52]])
    circle(x+dx*r,y+dy*r,r*dr);
}
function pine(x,baseY,h,w,col){
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x,baseY-h);
  ctx.quadraticCurveTo(x+w*0.12,baseY-h*0.5,x+w/2,baseY);
  ctx.lineTo(x-w/2,baseY);
  ctx.quadraticCurveTo(x-w*0.12,baseY-h*0.5,x,baseY-h);
  ctx.fill();
}
function roundTree(x,baseY,h,w,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-w*0.08,baseY-h*0.5,w*0.16,h*0.55);
  ctx.beginPath(); ctx.ellipse(x,baseY-h*0.64,w*0.5,h*0.4,0,0,Math.PI*2); ctx.fill();
}
function spike(x,fromY,len,w,col,down){
  const d=down?1:-1;
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x-w/2,fromY);
  ctx.quadraticCurveTo(x-w*0.1,fromY+d*len*0.5,x,fromY+d*len);
  ctx.quadraticCurveTo(x+w*0.1,fromY+d*len*0.5,x+w/2,fromY);
  ctx.closePath(); ctx.fill();
}
// Teardrop flame/feather: base (bx,by) of half-width w, tip at (tipX,tipY)
function flameUp(bx,by,tipX,tipY,w,col){
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(bx-w,by);
  ctx.quadraticCurveTo((bx+tipX)/2-w*1.5,(by+tipY)/2,tipX,tipY);
  ctx.quadraticCurveTo((bx+tipX)/2+w*1.5,(by+tipY)/2,bx+w,by);
  ctx.closePath(); ctx.fill();
}
function glowOrb(x,y,r,halo){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,halo); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; circle(x,y,r);
}
// Pulsing wisp marking the safe gap at a pillar lip
function gapGlow(x,y,halo,core){
  const p=0.75+0.25*Math.sin(torchPhase);
  glowOrb(x,y,24*p,halo);
  ctx.globalAlpha=p; ctx.fillStyle=core; circle(x,y,3.2); ctx.globalAlpha=1;
}
// Jagged tooth fringe hanging off a pillar lip (decorative, outside hitbox)
function toothEdge(x,w,yBase,dir,col,seed,maxT){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x,yBase);
  const n=5;
  for(let i=0;i<n;i++){
    ctx.lineTo(x+(i+0.5)*w/n, yBase+dir*(7+hash(seed+i)*maxT));
    ctx.lineTo(x+(i+1)*w/n, yBase);
  }
  ctx.closePath(); ctx.fill();
}
// Foliage cluster (canopy) centered on a pillar lip
function blobs(cx,cy,w,h,col,hi){
  ctx.fillStyle=col;
  for(const [dx,dy,r] of [[0,-0.06,0.5],[-0.32,0.10,0.36],[0.32,0.10,0.36],[-0.16,-0.2,0.3],[0.18,-0.22,0.3]]){
    ctx.beginPath(); ctx.ellipse(cx+dx*w,cy+dy*h,w*r*0.6,h*r,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle=hi;
  ctx.beginPath(); ctx.ellipse(cx-w*0.1,cy-h*0.16,w*0.2,h*0.18,0,0,Math.PI*2); ctx.fill();
}

/* ── TUNING ─────────────────────────────────────────────────── */
const GRAVITY       = 0.16;
const JUMP_VEL      = -4.8;
const HOLD_LIFT     = 0.11;
const BASE_SPEED    = 1.5;
const MAX_SPEED     = 3.6;
const BASE_GAP      = 195;
const MIN_GAP       = 128;
const BASE_INTERVAL = 1950;
const MIN_INTERVAL  = 1100;
const PIPE_W        = 58;
const BIRD_R        = 16;
const FORGIVE       = 8;
const GROUND_H      = 72;
const BIRD_X        = 100;
const ANG_UP        = -22;
const ANG_DOWN      = 78;
const PIPE_MIN_H    = 52;

/* ── BIOMES ──────────────────────────────────────────────────── */
const BIOMES = [
  { name:'Sunlit Forest',      at:0  },
  { name:'Dark Forest',        at:15 },
  { name:'Mossy Fortress',     at:32 },
  { name:'Lava Cavern',        at:55 },
  { name:'Volcanic Hellscape', at:82 },
];
function biomeOf(s){ let b=0; for(let i=0;i<BIOMES.length;i++) if(s>=BIOMES[i].at) b=i; return b; }
function pipeSpeed(s){ return BASE_SPEED+(MAX_SPEED-BASE_SPEED)*Math.min(s/80,1); }
function pipeGap(s)  { return BASE_GAP-(BASE_GAP-MIN_GAP)*Math.min(s/70,1)+(hasAbility('Keen Sight')?10:0); }
function pipeInt(s)  { return BASE_INTERVAL-(BASE_INTERVAL-MIN_INTERVAL)*Math.min(s/70,1); }

/* ── AUDIO ───────────────────────────────────────────────────── */
// Format detection — 'audio/ogg' without a codec returns 'maybe' on iOS 11+ (FLAC-in-OGG)
// but OGG Vorbis is not supported. Use the codec query to get an accurate answer.
const _canOgg=new Audio().canPlayType('audio/ogg; codecs="vorbis"')!=='';
// iOS + iPadOS require play() on each element during a user gesture
// (Chrome/Firefox use page-level activation after the first interaction)
const _isiOS=/iP(hone|ad|od)/.test(navigator.userAgent)||
             (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
// Fall back to .mp3 on browsers that can't play OGG
// (supply foo.mp3 alongside foo.ogg to enable iOS playback)
function _src(b,e){ return (e==='.ogg'&&!_canOgg)?b+'.mp3':b+e; }
const TRACK_SRCS=[_src('music/forest_music','.ogg'),'music/dark_forest.mp3',
                  _src('music/dungeon','.ogg'),_src('music/lava','.ogg'),'music/hell.mp3'];
const TRACKS=TRACK_SRCS.map(src=>{ const a=new Audio(src); a.loop=true; a.volume=0; return a; });
let curTrack=-1, audioUnlocked=false, muted=false;
const MUTE_VOL=0.65, AMBIENT_VOL=0.45;
const FOREST_AMB=new Audio('music/forest.mp3'); FOREST_AMB.loop=true; FOREST_AMB.volume=0;
const MENU_MUS=new Audio(_src('music/menu','.ogg')); MENU_MUS.loop=true; MENU_MUS.volume=0;
const OVER_MUS=new Audio(_src('music/gameover','.ogg')); OVER_MUS.loop=false; OVER_MUS.volume=0;
const _fadeIds=new WeakMap(); const _pauseIds=new WeakMap(); let _xfTimer=null;

/* ── SFX (Web Audio API — synthesized, no files needed) ─────── */
let sfxCtx=null;
function getSfx(){ if(!sfxCtx) sfxCtx=new(window.AudioContext||window.webkitAudioContext)(); return sfxCtx; }
function playClick(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.045;
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(1000,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(650,ac.currentTime+dur);
    const gain=ac.createGain();
    gain.gain.setValueAtTime(0.15,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+dur+0.01);
  }catch(e){}
}
function playFlap(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.08, sr=ac.sampleRate;
    const buf=ac.createBuffer(1,Math.floor(sr*dur),sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ const t=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-t,1.6); }
    const src=ac.createBufferSource(); src.buffer=buf;
    const filt=ac.createBiquadFilter(); filt.type='bandpass';
    filt.frequency.value=480+Math.random()*160; filt.Q.value=0.7;
    const gain=ac.createGain();
    gain.gain.setValueAtTime(0.38,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(); src.stop(ac.currentTime+dur+0.01);
  }catch(e){}
}

function playCloseCall(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.14;
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(360,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(130,ac.currentTime+dur);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.22,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+dur+0.01);
  }catch(e){}
}
function playMilestone(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    [523,659,784,1047].forEach((freq,i)=>{
      const t=ac.currentTime+i*0.08;
      const osc=ac.createOscillator(); osc.type='triangle';
      osc.frequency.setValueAtTime(freq,t);
      const g=ac.createGain();
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.17,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t); osc.stop(t+0.30);
    });
  }catch(e){}
}
function playDice(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    for(let i=0;i<6;i++){
      const t=ac.currentTime+i*0.075+Math.random()*0.02, dur=0.03;
      const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*(1-j/d.length);
      const src=ac.createBufferSource(); src.buffer=buf;
      const filt=ac.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=1700;
      const g=ac.createGain(); g.gain.setValueAtTime(0.18,t);
      src.connect(filt); filt.connect(g); g.connect(ac.destination);
      src.start(t);
    }
  }catch(e){}
}
function playBless(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    [660,880,1320].forEach((f,i)=>{
      const t=ac.currentTime+i*0.09;
      const o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f,t);
      const g=ac.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.14,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.55);
    });
  }catch(e){}
}
function playCurse(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.6;
    const o=ac.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(180,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(55,ac.currentTime+dur);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.16,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur+0.02);
  }catch(e){}
}
function playWardBreak(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.18;
    const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,1.4);
    const src=ac.createBufferSource(); src.buffer=buf;
    const filt=ac.createBiquadFilter(); filt.type='bandpass';
    filt.frequency.value=2600; filt.Q.value=0.8;
    const g=ac.createGain(); g.gain.setValueAtTime(0.30,ac.currentTime);
    src.connect(filt); filt.connect(g); g.connect(ac.destination);
    src.start(); src.stop(ac.currentTime+dur+0.01);
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(1400,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(850,ac.currentTime+0.16);
    const og=ac.createGain();
    og.gain.setValueAtTime(0.14,ac.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.16);
    o.connect(og); og.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+0.18);
  }catch(e){}
}
function playRebirth(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(200,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(900,ac.currentTime+0.45);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.20,ac.currentTime+0.30);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.55);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+0.58);
    [880,1100].forEach((f,i)=>{
      const t=ac.currentTime+0.35+i*0.10;
      const o2=ac.createOscillator(); o2.type='triangle'; o2.frequency.setValueAtTime(f,t);
      const g2=ac.createGain(); g2.gain.setValueAtTime(0,t);
      g2.gain.linearRampToValueAtTime(0.13,t+0.02);
      g2.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o2.connect(g2); g2.connect(ac.destination); o2.start(t); o2.stop(t+0.45);
    });
  }catch(e){}
}
function unlockAudio(){
  if(audioUnlocked) return; audioUnlocked=true; getSfx();
  // iOS/iPadOS requires play() on each element during the user gesture.
  // Other browsers (Chrome, Firefox) use page-level activation after first click,
  // so pre-unlocking all elements there causes unwanted simultaneous streams.
  if(_isiOS) [...TRACKS,OVER_MUS].forEach(a=>{ const p=a.play();if(p)p.catch(()=>{}); schedulePause(a,0); });
  const p=MENU_MUS.play(); if(p) p.catch(()=>{});
  if(!muted) fadeAudio(MENU_MUS,MUTE_VOL*0.75,0.02);
}
function stopMenuMusic(){ fadeAudio(MENU_MUS,0,0.06); schedulePause(MENU_MUS,600); }
function playGameOver(){
  OVER_MUS.currentTime=0; cancelPause(OVER_MUS);
  const p=OVER_MUS.play(); if(p) p.catch(()=>{});
  if(!muted) fadeAudio(OVER_MUS,MUTE_VOL,0.03);
}
function stopGameOver(){ fadeAudio(OVER_MUS,0,0.10); schedulePause(OVER_MUS,400); }
function toggleMute(){
  muted=!muted;
  TRACKS.forEach(t=>{ t.volume=muted?0:(t===TRACKS[curTrack]?MUTE_VOL:0); });
  FOREST_AMB.volume=muted?0:(curTrack===0?AMBIENT_VOL:0);
  MENU_MUS.volume=muted?0:(state===S.START?MUTE_VOL*0.75:0);
  OVER_MUS.volume=muted?0:(state===S.DEAD?MUTE_VOL:0);
}
function fadeAudio(a,toVol,step){
  if(_fadeIds.has(a)){ clearInterval(_fadeIds.get(a)); _fadeIds.delete(a); }
  const id=setInterval(()=>{
    a.volume=toVol>a.volume?Math.min(toVol,a.volume+step):Math.max(toVol,a.volume-step);
    if(Math.abs(a.volume-toVol)<0.001){ a.volume=toVol; clearInterval(id); _fadeIds.delete(a); }
  },50);
  _fadeIds.set(a,id);
}
function schedulePause(a,delay){
  if(_pauseIds.has(a)){ clearTimeout(_pauseIds.get(a)); _pauseIds.delete(a); }
  const id=setTimeout(()=>{ _pauseIds.delete(a); a.pause(); },delay);
  _pauseIds.set(a,id);
}
function cancelPause(a){ if(_pauseIds.has(a)){ clearTimeout(_pauseIds.get(a)); _pauseIds.delete(a); } }
function stopAudio(a){
  if(_fadeIds.has(a)){ clearInterval(_fadeIds.get(a)); _fadeIds.delete(a); }
  cancelPause(a); a.volume=0; a.pause();
}
function crossfadeTrack(idx){
  if(idx===curTrack) return;
  curTrack=idx;
  // Fade out all non-target tracks quickly (step=0.10 → ~325ms from MUTE_VOL to silence)
  TRACKS.forEach((t,i)=>{ if(i!==idx){ fadeAudio(t,0,0.10); schedulePause(t,400); } });
  if(_xfTimer){ clearTimeout(_xfTimer); _xfTimer=null; }
  const n=TRACKS[idx];
  // Play synchronously at vol=0 — this call is in the user-gesture stack on first start
  // (go() → crossfadeTrack), satisfying Chrome and iOS autoplay requirements.
  // For mid-game biome changes, page activation from the first gesture covers it.
  cancelPause(n); n.currentTime=0; const np=n.play(); if(np) np.catch(()=>{});
  // Fade-in starts at 400ms — after non-target tracks are fully silent (~325ms)
  if(!muted) _xfTimer=setTimeout(()=>{ _xfTimer=null; fadeAudio(n,MUTE_VOL,0.03); },400);
  if(idx===0){ cancelPause(FOREST_AMB); const fp=FOREST_AMB.play();if(fp)fp.catch(()=>{}); if(!muted) fadeAudio(FOREST_AMB,AMBIENT_VOL,0.02); }
  else { fadeAudio(FOREST_AMB,0,0.08); schedulePause(FOREST_AMB,450); }
}

/* ── STORAGE (safe wrapper — localStorage throws in iOS private mode) ─── */
function lsGet(k,d){ try{ return localStorage.getItem(k)??d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ── STATE ───────────────────────────────────────────────────── */
const S = {START:0,PLAY:1,DEAD:2};
let state=S.START, score=0, best=parseInt(lsGet('gauntlet_best','0'),10), biome=0, fadeAlpha=0, curSpeed=BASE_SPEED;
let worldX=0;
let shakeAmt=0, closeCooldown=0, closeCallFlash=0;
let milestoneText='', milestoneTtl=0;
let biomeAnnName='', biomeAnnTtl=0;

/* ── FATE DIE & ABILITIES (tabletop-fantasy layer) ───────────── */
const FATE_FIRST=7, FATE_EVERY=10; // rolls at 7, 17, 27… (clear of milestones)
let ward=false, invulnTtl=0, rebirthUsed=false;
let curseTtl=0, blessTtl=0;

const bird = {x:BIRD_X,y:LH/2,vy:0,angle:0,wing:0};
function resetBird(){ Object.assign(bird,{x:BIRD_X,y:LH/2,vy:0,angle:0,wing:0}); }
function flap(){ bird.vy=JUMP_VEL; bird.wing=0; spawnMagic(); playFlap(); }
let held=false;
function updateBird(){
  bird.vy += hasAbility('Glide')?GRAVITY*0.86:GRAVITY;
  if(held && state===S.PLAY){ bird.vy -= HOLD_LIFT; bird.vy=Math.max(bird.vy,-3.2); }
  bird.y += bird.vy;
  const ta=(bird.vy/10)*ANG_DOWN;
  bird.angle += (Math.max(ANG_UP,Math.min(ANG_DOWN,ta))-bird.angle)*0.18;
  bird.wing = (bird.wing+0.22)%(Math.PI*2);
}

/* ── PIPES ───────────────────────────────────────────────────── */
let pipes=[], lastPipe=0, lastGapCenter=LH/2;
function spawnPipe(now){
  const gap=pipeGap(score);
  const minC=PIPE_MIN_H+gap/2, maxC=LH-GROUND_H-PIPE_MIN_H-gap/2;
  // Limit how far the gap moves between consecutive pillars so every jump
  // is physically makeable. Climbing is slower than diving, so the upward
  // shift is clamped tighter than the downward one. Scales with spawn
  // interval: more time between pillars = more allowed travel.
  const frames=pipeInt(score)/16.7;
  const maxUp=Math.min(frames*2.0,250), maxDown=Math.min(frames*3.0,320);
  let c=minC+Math.random()*(maxC-minC);
  c=Math.max(lastGapCenter-maxUp, Math.min(lastGapCenter+maxDown, c));
  c=Math.max(minC, Math.min(maxC, c));
  lastGapCenter=c;
  pipes.push({x:LW+PIPE_W, topH:c-gap/2, botY:c+gap/2, passed:false});
  lastPipe=now;
}
function updatePipes(now){
  curSpeed=pipeSpeed(score)*(curseTtl>0?1.35:blessTtl>0?0.80:1);
  if(now-lastPipe>pipeInt(score)) spawnPipe(now);
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i]; p.x-=curSpeed;
    if(!p.passed && p.x+PIPE_W<bird.x-BIRD_R){
      p.passed=true; score++;
      if([10,25,50,75,100].includes(score)){ milestoneText=score+'!'; milestoneTtl=1.0; playMilestone(); }
      if(closeCooldown<=0){
        const clearTop=bird.y-(BIRD_R-FORGIVE)-p.topH;
        const clearBot=p.botY-(bird.y+(BIRD_R-FORGIVE));
        if(clearTop<14||clearBot<14){ closeCooldown=40; closeCallFlash=1; playCloseCall(); }
      }
      const nb=biomeOf(score);
      if(nb!==biome){ biome=nb; fadeAlpha=1.0; crossfadeTrack(nb); biomeAnnName=BIOMES[nb].name.toUpperCase(); biomeAnnTtl=1.0; }
      if(score>=nextFate){ nextFate+=FATE_EVERY; startFateRoll(); }
    }
    if(p.x+PIPE_W<-10) pipes.splice(i,1);
  }
}
function resetPipes(){ pipes=[]; lastPipe=0; curSpeed=BASE_SPEED; lastGapCenter=LH/2; }

/* ── COLLISION ───────────────────────────────────────────────── */
function collides(){
  const r=BIRD_R-FORGIVE;
  if(bird.y+r>=LH-GROUND_H||bird.y-r<=0) return true;
  for(const p of pipes)
    if(bird.x+r>p.x&&bird.x-r<p.x+PIPE_W)
      if(bird.y-r<p.topH||bird.y+r>p.botY) return true;
  return false;
}

function updateParts(){
  lavaPhase+=0.04; torchPhase+=0.09;
  if(closeCooldown>0) closeCooldown--;
  if(closeCallFlash>0) closeCallFlash=Math.max(0,closeCallFlash-0.07);
  if(milestoneTtl>0) milestoneTtl=Math.max(0,milestoneTtl-0.020);
  if(biomeAnnTtl>0) biomeAnnTtl=Math.max(0,biomeAnnTtl-0.006);
  if(curseTtl>0) curseTtl--;
  if(blessTtl>0) blessTtl--;
  if(invulnTtl>0) invulnTtl--;
  if(noticeTtl>0) noticeTtl=Math.max(0,noticeTtl-0.012);
  if(fateDieTtl>0) fateDieTtl=Math.max(0,fateDieTtl-0.010);
  if(fateAnim>0&&state===S.PLAY){
    fateAnim--;
    if(fateAnim%4===0) fateFace=1+Math.floor(Math.random()*20);
    if(fateAnim===0) resolveFate();
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life-=0.04;
    if(p.life<=0) parts.splice(i,1);
  }
  for(let i=magic.length-1;i>=0;i--){
    const p=magic[i]; p.x+=p.vx; p.y+=p.vy; p.vy-=0.06; p.life-=0.07;
    if(p.life<=0) magic.splice(i,1);
  }
  for(let i=embers.length-1;i>=0;i--){
    const e=embers[i]; e.x+=e.vx; e.y+=e.vy; e.vy-=0.03; e.life-=0.018;
    if(e.life<=0||e.y<0) embers.splice(i,1);
  }
  // Mobile: cap total live particles to keep frame rate stable
  if(isMobile){
    if(embers.length>18) embers.length=18;
    if(magic.length>8) magic.length=8;
  }
}
/* ── FATE DIE LOGIC ──────────────────────────────────────────── */
function rollD20(){ return 1+Math.floor(Math.random()*20); }
function startFateRoll(){ fateAnim=52; fateDieTtl=0; playDice(); }
function resolveFate(){
  let r=rollD20();
  if(hasAbility('Fortune')) r=Math.max(r,rollD20());
  fateFace=r; fateDieTtl=1;
  if(r===1){ curseTtl=360; blessTtl=0; fateCol='#ff5544';
    notice('CURSE OF HASTE!','#ff5544'); playCurse(); }
  else if(r<10){ fateCol='#9ca3af'; notice('The fates are silent…','#9ca3af'); }
  else if(r<15){ blessTtl=240; curseTtl=0; fateCol='#7dd3fc';
    notice("ZEPHYR'S BLESSING","#7dd3fc"); playBless(); }
  else if(r<20){ ward=true; fateCol='#a78bfa';
    notice('ARCANE WARD!','#a78bfa'); playBless(); }
  else { ward=true; blessTtl=480; curseTtl=0; fateCol='#fbbf24';
    notice('FATE SMILES UPON YOU!','#fbbf24'); playBless(); spawnFateBurst(); }
}
function spawnFateBurst(){

    const a=Math.PI*2*i/18, sp=1.5+Math.random()*3;
    magic.push({x:bird.x,y:bird.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,

}

function spawnRebirthBurst(){

// Collision outcome — ward and rebirth intercept death
function onHit(){
  if(ward){
    ward=false; invulnTtl=80; shakeAmt=5;
    bird.vy=JUMP_VEL; bird.y=Math.max(60,Math.min(bird.y,LH-GROUND_H-60));
    playWardBreak(); spawnWardShatter(); notice('WARD SHATTERED!','#a78bfa');
    return;
  }
  if(hasAbility('Rebirth')&&!rebirthUsed){
    rebirthUsed=true; invulnTtl=120; shakeAmt=6;
    bird.vy=JUMP_VEL; bird.y=Math.max(60,Math.min(bird.y,LH-GROUND_H-80));
    playRebirth(); spawnRebirthBurst(); notice('REBORN IN FLAME!','#fb923c');
    return;
  }
  die();
}

/* ── ROUNDED RECT ────────────────────────────────────────────── */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawBats(count,rateX,yMin,yMax,sz,col,glowEyes){
  const spacing=Math.round((LW+sz*14)/count);
  const batOff=(worldX*rateX)%spacing;
  for(let i=0;i<count;i++){
    const bx=Math.round(((i*spacing-batOff+spacing*count*2)%(spacing*count))-sz*7);
    const by=yMin+(i%3)*Math.round((yMax-yMin)/3)+Math.round(Math.sin(worldX*0.03+i*0.9)*7);
    const wf=Math.sin(worldX*0.11+i*1.6)*sz*0.65;
    ctx.fillStyle=col;
    ctx.save(); ctx.scale(1,0.72); ctx.beginPath(); ctx.arc(bx,by/0.72,sz*1.15,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.moveTo(bx-sz*0.75,by+sz*0.25);
    ctx.quadraticCurveTo(bx-sz*3.4,by-sz*1.4+wf,bx-sz*4.8,by+sz*0.9);
    ctx.quadraticCurveTo(bx-sz*2.4,by+sz*0.8,bx-sz*0.75,by+sz*0.25); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx+sz*0.75,by+sz*0.25);
    ctx.quadraticCurveTo(bx+sz*3.4,by-sz*1.4+wf,bx+sz*4.8,by+sz*0.9);
    ctx.quadraticCurveTo(bx+sz*2.4,by+sz*0.8,bx+sz*0.75,by+sz*0.25); ctx.fill();
    if(glowEyes){
      ctx.globalAlpha=0.68+0.28*Math.sin(torchPhase+i*1.3);
      ctx.fillStyle='#ff1100';
      ctx.beginPath(); ctx.arc(bx-sz*0.4,by-sz*0.15,sz*0.28,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(bx+sz*0.4,by-sz*0.15,sz*0.28,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}
function drawEmberLayer(){
  for(const e of embers){
    ctx.globalAlpha=e.life; ctx.fillStyle=e.c;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function tower(x,baseY,h,w,col,t){
  ctx.fillStyle=col;
  ctx.fillRect(x-w/2,baseY-h,w,h+34);
  if(t>0.62){
    ctx.beginPath(); ctx.moveTo(x-w/2-4,baseY-h);
    ctx.lineTo(x,baseY-h-w*0.95); ctx.lineTo(x+w/2+4,baseY-h);
    ctx.closePath(); ctx.fill();
  } else {
    const mw=w/5;
    for(let i=0;i<3;i++) ctx.fillRect(x-w/2+i*2*mw,baseY-h-mw,mw,mw+1);
  }
  ctx.fillStyle='rgba(140,235,175,0.5)';
  ctx.fillRect(x-2,baseY-h+13,4,8);
  if(h>80) ctx.fillRect(x-2,baseY-h+40,4,8);
}
function archRuin(x,baseY,h,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-27,baseY-h,11,h+24);
  ctx.fillRect(x+16,baseY-h,11,h+24);
  ctx.beginPath();
  ctx.moveTo(x-27,baseY-h+7);
  ctx.quadraticCurveTo(x,baseY-h-24,x+27,baseY-h+7);

/* ── GROUND ──────────────────────────────────────────────────── */
function drawGround(){
  const gy=LH-GROUND_H;
  if(biome===0){
    ctx.fillStyle='#16382a'; ctx.fillRect(0,gy,LW,GROUND_H);
    ctx.fillStyle='#2c5e40'; ctx.fillRect(0,gy,LW,14);
    ctx.fillStyle='#4d8a5e'; ctx.fillRect(0,gy,LW,4);
    ctx.fillStyle='rgba(0,0,0,0.20)';
    for(let x=-gOff;x<LW+48;x+=48){
      ctx.beginPath(); ctx.ellipse(x+20,gy+34,9,4,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+40,gy+52,6,3,0,0,Math.PI*2); ctx.fill();
    }
  } else if(biome===1){
    ctx.fillStyle='#0a0918'; ctx.fillRect(0,gy,LW,GROUND_H);
    ctx.fillStyle='#181430'; ctx.fillRect(0,gy,LW,12);
    ctx.fillStyle='#262048'; ctx.fillRect(0,gy,LW,3);
    ctx.strokeStyle='rgba(120,130,180,0.16)'; ctx.lineWidth=2;
    for(let x=-gOff*.7;x<LW+80;x+=80){
      ctx.beginPath(); ctx.moveTo(x,gy+14); ctx.quadraticCurveTo(x+10,gy+30,x+6,gy+48); ctx.stroke();
    }
  } else if(biome===2){
    ctx.fillStyle='#0a1715'; ctx.fillRect(0,gy,LW,GROUND_H);
    ctx.fillStyle='#15302a'; ctx.fillRect(0,gy,LW,10);
    ctx.fillStyle='#2c5a40'; ctx.fillRect(0,gy,LW,3);
    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1;
    for(let x=-gOff;x<LW+48;x+=48){
      ctx.strokeRect(Math.round(x),gy+10,48,GROUND_H-10);
      ctx.fillStyle='rgba(70,140,60,0.35)';
      ctx.fillRect(Math.round(x)+3,gy+10,8,3);
    }
  } else if(biome===3){
    ctx.fillStyle='#0c0500'; ctx.fillRect(0,gy,LW,GROUND_H);
    const lsg=ctx.createLinearGradient(0,gy,0,gy+22);
    lsg.addColorStop(0,`rgba(255,${80+30*Math.sin(lavaPhase*2)},0,0.95)`);
    lsg.addColorStop(1,'rgba(120,20,0,0)');
    ctx.fillStyle=lsg;
    ctx.beginPath(); ctx.moveTo(-5,gy+22);
    for(let wx=0;wx<=LW+8;wx+=6)
      ctx.lineTo(wx,gy+8+Math.sin(wx*0.05+lavaPhase*3)*4+Math.sin(wx*0.12+lavaPhase*2)*2);
    ctx.lineTo(LW+5,gy+22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=`rgba(255,69,0,${.55+.35*Math.sin(lavaPhase)})`; ctx.lineWidth=2;
    for(let x=-gOff;x<LW+60;x+=60){
      ctx.beginPath();
      ctx.moveTo(x,gy+4); ctx.lineTo(x+18,gy+14);
      ctx.lineTo(x+34,gy+7); ctx.lineTo(x+54,gy+18); ctx.stroke();
    }
  } else {
    const hf=ctx.createLinearGradient(0,gy,0,gy+GROUND_H);
    hf.addColorStop(0,'#7f1d1d'); hf.addColorStop(1,'#450a0a');
    ctx.fillStyle=hf; ctx.fillRect(0,gy,LW,GROUND_H);
    const lsg2=ctx.createLinearGradient(0,gy,0,gy+22);
    lsg2.addColorStop(0,`rgba(255,${70+40*Math.sin(lavaPhase*2)},0,0.92)`);
    lsg2.addColorStop(1,'rgba(180,20,0,0)');
    ctx.fillStyle=lsg2;
    ctx.beginPath(); ctx.moveTo(-5,gy+22);
    for(let wx=0;wx<=LW+8;wx+=6)
      ctx.lineTo(wx,gy+7+Math.sin(wx*0.04+lavaPhase*2.5)*5+Math.sin(wx*0.10+lavaPhase*1.8)*2);
    ctx.lineTo(LW+5,gy+22); ctx.closePath(); ctx.fill();
  }
}

/* ── PIPES PER BIOME ─────────────────────────────────────────── */
function drawPipes(){
  for(const p of pipes){
    if(biome<=1)       drawForestPillar(p);
    else if(biome===2) drawStonePillar(p);
    else if(biome===3) drawLavaPillar(p);
    else               drawHellPillar(p);
  }
}

  ctx.beginPath(); ctx.ellipse(-7,0,11,5*(sy||1),0.12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=c.whi;
  ctx.beginPath(); ctx.ellipse(-9,-1.5,6.5,2.4*(sy||1),0.12,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function vEye(c,ex,ey){

/* ── BIRD DRAW ───────────────────────────────────────────────── */
function drawBird(){
  ctx.save();
  if(invulnTtl>0) ctx.globalAlpha=0.5+0.35*Math.sin(invulnTtl*0.5);
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.angle*Math.PI/180);
  const wo=Math.round(Math.sin(bird.wing)*5); // wing flap offset

  // Flame trail biome 3+
  if(biome>=3){
    const ga=ctx.globalAlpha;
    for(let i=0;i<5;i++){
      ctx.globalAlpha=ga*(1-i/5)*.85;
      ctx.fillStyle=biome>=4?'#ff2200':'#ff8800';
      ctx.fillRect(-15-i*6, Math.round(Math.sin(bird.wing+i)*3)-3, 5, 6);
    }
    ctx.globalAlpha=ga;
  }

  drawChampion(selectedChar,wo,bird.wing);
  ctx.restore();
}

/* ── ARCANE WARD BUBBLE ──────────────────────────────────────── */
function drawWard(){
  if(!ward) return;
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.globalAlpha=0.50+0.20*Math.sin(torchPhase*2);
  ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,27,0,Math.PI*2); ctx.stroke();

    const a=torchPhase+i*Math.PI/2;
    ctx.fillRect(Math.round(Math.cos(a)*27)-2,Math.round(Math.sin(a)*27)-2,4,4);
  }
  ctx.restore();
}

/* ── FATE DIE OVERLAY ────────────────────────────────────────── */
function drawFateDie(){
  if(fateAnim<=0&&fateDieTtl<=0) return;
  const rolling=fateAnim>0;
  const a=rolling?1:(fateDieTtl<0.25?fateDieTtl*4:1);
  const dx=LW/2, dy=126, R=20;
  const col=rolling?'#c4b5fd':fateCol;
  ctx.save(); ctx.globalAlpha=a;
  ctx.translate(dx,dy);
  const rot=rolling?fateAnim*0.25:0;
  ctx.rotate(rot);
  // d20 face: hexagonal silhouette with inner triangle
  ctx.fillStyle='rgba(10,5,25,0.85)';
  ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const an=-Math.PI/2+i*Math.PI/3;
    i?ctx.lineTo(Math.cos(an)*R,Math.sin(an)*R):ctx.moveTo(Math.cos(an)*R,Math.sin(an)*R);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.globalAlpha=a*0.45;
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const an=-Math.PI/2+i*Math.PI*2/3;
    i?ctx.lineTo(Math.cos(an)*R,Math.sin(an)*R):ctx.moveTo(Math.cos(an)*R,Math.sin(an)*R);
  }
  ctx.closePath(); ctx.stroke();
  ctx.globalAlpha=a;
  ctx.rotate(-rot);
  ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 14px Georgia';
  ctx.fillText(fateFace,0,1);
  ctx.font='bold 9px Georgia';
  ctx.fillStyle='rgba(196,181,253,0.8)';
  ctx.fillText('FATE',0,-R-10);
  ctx.restore();
}
function drawNotice(){
  if(noticeTtl<=0) return;

  ctx.textAlign='center'; ctx.textBaseline='middle';

/* ── TRAIL ───────────────────────────────────────────────────── */
function spawnTrail(){
  const c=CHARS[selectedChar];
  const rate=isMobile?0.45:0.70;
  if(Math.random()<rate)
    trail.push({x:bird.x-14,y:bird.y+2+(Math.random()-.5)*8,
      vx:-(0.5+Math.random()*0.8),vy:(Math.random()-.5)*0.8,
      life:1,r:1+Math.random()*2.2,c:c.spark});
}
function updateTrail(){
  for(let i=trail.length-1;i>=0;i--){
    const t=trail[i]; t.x+=t.vx; t.y+=t.vy; t.life-=0.07;
    if(t.life<=0) trail.splice(i,1);
  }
  if(isMobile && trail.length>12) trail.length=12;
}
function drawTrail(){
  for(const t of trail){
    ctx.globalAlpha=t.life*0.65;
    ctx.fillStyle=t.c;
    const sz=Math.max(1,Math.round(t.r*t.life));
    ctx.fillRect(Math.round(t.x-sz/2),Math.round(t.y-sz/2),sz,sz);
  }
  ctx.globalAlpha=1;
}

}

/* ── MAIN LOOP ───────────────────────────────────────────────── */
function loop(now){
  requestAnimationFrame(loop);
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,LW,LH);
  if(shakeAmt>0){
    const sx=Math.round((Math.random()-.5)*shakeAmt*2.2);
    const sy=Math.round((Math.random()-.5)*shakeAmt*1.8);
    ctx.setTransform(scale,0,0,scale,sx*scale,sy*scale);
    shakeAmt=Math.max(0,shakeAmt-0.55);
  }

  worldX += state===S.PLAY ? curSpeed : 0.35;

  if(biome===0)      drawBG0();
  else if(biome===1) drawBG1();
  else if(biome===2) drawBG2();
  else if(biome===3) drawBG3();
  else               drawBG4();

  if(fadeAlpha>0){
    ctx.fillStyle=`rgba(0,0,0,${fadeAlpha})`;
    ctx.fillRect(0,0,LW,LH);
    fadeAlpha=Math.max(0,fadeAlpha-.022);
  }

  if(state===S.START){
    idleBird(now); updateParts();
    drawGround(); drawParts(); drawBird(); drawStart(now); drawMuteBtn();
  } else if(state===S.PLAY){
    updateBird(); updatePipes(now); updateGround(); updateParts(); spawnTrail(); updateTrail();
    drawPipes(); drawGround(); drawParts(); drawTrail(); drawBird(); drawWard(); drawScore(); drawStatus(); drawFlash(); drawCloseCallFlash(); drawCurseVignette(); drawMilestonePop(); drawBiomeAnn(); drawFateDie(); drawNotice();
    if(invulnTtl<=0&&collides()) onHit();
  } else {
    updateGround(); updateParts(); updateTrail();
    drawPipes(); drawGround(); drawParts(); drawTrail(); drawBird(); drawScore(); drawFlash(); drawDead();
  }
}

/* ── GAME EVENTS ─────────────────────────────────────────────── */
function die(){
  state=S.DEAD; flash=1; shakeAmt=9; best=Math.max(best,score);
  lsSet('gauntlet_best',best);
  if(_xfTimer){ clearTimeout(_xfTimer); _xfTimer=null; }
  TRACKS.forEach(t=>{ fadeAudio(t,0,0.10); schedulePause(t,400); });
  fadeAudio(FOREST_AMB,0,0.10); schedulePause(FOREST_AMB,400);
  curTrack=-1;
  playGameOver();
  spawnDeath(); bird.vy=0; bird.angle=75; trail=[];
}
function go(){
  playClick();
  score=0; state=S.PLAY; held=false; biome=0; fadeAlpha=0;
  embers=[]; parts=[]; magic=[]; trail=[];
  shakeAmt=0; milestoneTtl=0; biomeAnnTtl=0; closeCallFlash=0;
  ward=false; invulnTtl=0; rebirthUsed=false; curseTtl=0; blessTtl=0;
  fateAnim=0; fateDieTtl=0; noticeTtl=0; nextFate=FATE_FIRST;
  lastPipe=performance.now()-(BASE_INTERVAL-950);
  stopAudio(MENU_MUS); stopAudio(OVER_MUS);
  crossfadeTrack(0);
  resetBird(); resetPipes(); flap();
}
function input(){
  unlockAudio();
  if(state===S.START||state===S.DEAD) go(); else flap();
}
document.addEventListener('keydown',e=>{
  if(e.code==='KeyM'){ e.preventDefault(); toggleMute(); return; }
  if(e.code==='Space'||e.key==='ArrowUp'){ e.preventDefault(); if(!e.repeat) input(); held=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.key==='ArrowUp') held=false;
});
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const cx=e.offsetX/scale, cy=e.offsetY/scale;
  if(muteHit(cx,cy)){ toggleMute(); playClick(); return; }
  if(state===S.START||state===S.DEAD){
    const rowY=(LH/2-8)+(state===S.DEAD?72:62);
    const charXs=[LW/2-90,LW/2-30,LW/2+30,LW/2+90];
    for(let i=0;i<CHARS.length;i++){
      if(Math.abs(cx-charXs[i])<22&&Math.abs(cy-rowY)<22){
        selectedChar=i; lsSet('gauntlet_char',i); playClick(); return;
      }
    }
  }
  held=true; input();
});
canvas.addEventListener('pointerup',()=>held=false);
canvas.addEventListener('pointerleave',()=>held=false);

// Resume audio after tab switch / app switch (mobile browser and desktop)
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!audioUnlocked) return;
  if(sfxCtx&&sfxCtx.state==='suspended') sfxCtx.resume().catch(()=>{});
  if(state===S.PLAY&&curTrack>=0){
    const t=TRACKS[curTrack]; if(t.paused){const p=t.play();if(p)p.catch(()=>{});}
    if(curTrack===0&&FOREST_AMB.paused){const p=FOREST_AMB.play();if(p)p.catch(()=>{});}
  }
  if(state===S.START&&MENU_MUS.paused){const p=MENU_MUS.play();if(p)p.catch(()=>{});}
  if(state===S.DEAD&&OVER_MUS.paused){const p=OVER_MUS.play();if(p)p.catch(()=>{});}
});

requestAnimationFrame(loop);
})();
</script>
