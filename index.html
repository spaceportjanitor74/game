<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="theme-color" content="#0a0010" />
  <title>The Gauntlet</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0010;
      display:flex; align-items:center; justify-content:center;
      font-family:'Georgia',serif; touch-action:none;
      overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
    canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges;
      image-rendering:-moz-crisp-edges; touch-action:none; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(function(){
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const LW = 480, LH = 640;
let scale = 1;
const isMobile = ('ontouchstart' in window) || window.matchMedia('(pointer:coarse)').matches;
function resize(){
  const vp = window.visualViewport;
  const vw = vp ? vp.width  : window.innerWidth;
  const vh = vp ? vp.height : window.innerHeight;
  scale = Math.min(vw/LW, vh/LH);
  canvas.width  = Math.round(LW*scale);
  canvas.height = Math.round(LH*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize', resize);
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('contextmenu', e=>e.preventDefault());
resize();

/* ── IMAGE PRELOAD ───────────────────────────────────────────── */
const IMGS = {};
let imgsLoaded = 0;
const IMG_DEFS = [
  // Biome 0 – Sunlit Forest (CC0, MatiasVME / opengameart.org)
  ['b0_sky',    'bg/b0_sky.png'],
  ['b0_clouds', 'bg/b0_clouds.png'],
  ['b0_mtn1',   'bg/b0_mtn1.png'],
  ['b0_mtn2',   'bg/b0_mtn2.png'],
  ['b0_mtn3',   'bg/b0_mtn3.png'],
  ['b0_rocks',  'bg/b0_rocks.png'],
  ['b0_trees',  'bg/b0_trees.png'],
  // Biome 1 – Enchanted Forest (CC-BY 4.0, Admurin / admurin.itch.io)
  ['b1_0','bg/b1_0.png'],['b1_1','bg/b1_1.png'],['b1_2','bg/b1_2.png'],
  ['b1_3','bg/b1_3.png'],['b1_4','bg/b1_4.png'],['b1_5','bg/b1_5.png'],['b1_6','bg/b1_6.png'],
  // Biome 2 – Mossy Fortress (CC0, ansimuz / opengameart.org – Gothicvania)
  ['b2_back','bg/b2_back.png'],['b2_mid','bg/b2_mid.png'],['b2_col','bg/b2_col.png'],
  // Biome 3 – Lava Cavern (CC-BY 4.0, Admurin)
  ['b3_0','bg/b3_0.png'],['b3_1','bg/b3_1.png'],['b3_2','bg/b3_2.png'],
  ['b3_3','bg/b3_3.png'],['b3_4','bg/b3_4.png'],['b3_5','bg/b3_5.png'],
  // Biome 4 – Volcanic Hellscape (CC0, Tio Aimar / opengameart.org)
  ['b4_1','bg/b4_1.png'],['b4_2','bg/b4_2.png'],['b4_3','bg/b4_3.png'],
  ['b4_4','bg/b4_4.png'],['b4_5','bg/b4_5.png'],['b4_6','bg/b4_6.png'],
];
const imgsTotal = IMG_DEFS.length;
IMG_DEFS.forEach(([key,src])=>{
  const img = new Image();
  img.onload  = ()=>{ IMGS[key]=img; imgsLoaded++; };
  img.onerror = ()=>{ imgsLoaded++; }; // fail gracefully, canvas fallbacks kick in
  img.src = src;
});

/* ── TUNING ─────────────────────────────────────────────────── */
const GRAVITY       = 0.16;
const JUMP_VEL      = -4.8;
const HOLD_LIFT     = 0.11;
const BASE_SPEED    = 1.5;
const MAX_SPEED     = 3.6;
const BASE_GAP      = 195;
const MIN_GAP       = 128;
const BASE_INTERVAL = 1950;
const MIN_INTERVAL  = 1100;
const PIPE_W        = 58;
const BIRD_R        = 16;
const FORGIVE       = 8;
const GROUND_H      = 72;
const BIRD_X        = 100;
const ANG_UP        = -22;
const ANG_DOWN      = 78;
const PIPE_MIN_H    = 52;

/* ── BIOMES ──────────────────────────────────────────────────── */
const BIOMES = [
  { name:'Sunlit Forest',      at:0  },
  { name:'Dark Forest',        at:8  },
  { name:'Mossy Fortress',     at:18 },
  { name:'Lava Cavern',        at:32 },
  { name:'Volcanic Hellscape', at:50 },
];
function biomeOf(s){ let b=0; for(let i=0;i<BIOMES.length;i++) if(s>=BIOMES[i].at) b=i; return b; }
function pipeSpeed(s){ return BASE_SPEED+(MAX_SPEED-BASE_SPEED)*Math.min(s/80,1); }
function pipeGap(s)  { return BASE_GAP-(BASE_GAP-MIN_GAP)*Math.min(s/70,1); }
function pipeInt(s)  { return BASE_INTERVAL-(BASE_INTERVAL-MIN_INTERVAL)*Math.min(s/70,1); }

/* ── AUDIO ───────────────────────────────────────────────────── */
const TRACK_SRCS=['music/forest_music.ogg','music/dark_forest.ogg','music/dungeon.ogg','music/lava.ogg','music/hell.mp3'];
const TRACKS=TRACK_SRCS.map(src=>{ const a=new Audio(src); a.loop=true; a.volume=0; return a; });
let curTrack=-1, audioUnlocked=false, muted=false;
const MUTE_VOL=0.65, AMBIENT_VOL=0.45;
const FOREST_AMB=new Audio('music/forest.mp3'); FOREST_AMB.loop=true; FOREST_AMB.volume=0;
const MENU_MUS=new Audio('music/menu.ogg'); MENU_MUS.loop=true; MENU_MUS.volume=0;
const OVER_MUS=new Audio('music/gameover.ogg'); OVER_MUS.loop=false; OVER_MUS.volume=0;

/* ── SFX (Web Audio API — synthesized, no files needed) ─────── */
let sfxCtx=null;
function getSfx(){ if(!sfxCtx) sfxCtx=new(window.AudioContext||window.webkitAudioContext)(); return sfxCtx; }
function playClick(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.045;
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(1000,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(650,ac.currentTime+dur);
    const gain=ac.createGain();
    gain.gain.setValueAtTime(0.15,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+dur+0.01);
  }catch(e){}
}
function playFlap(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.08, sr=ac.sampleRate;
    const buf=ac.createBuffer(1,Math.floor(sr*dur),sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ const t=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-t,1.6); }
    const src=ac.createBufferSource(); src.buffer=buf;
    const filt=ac.createBiquadFilter(); filt.type='bandpass';
    filt.frequency.value=480+Math.random()*160; filt.Q.value=0.7;
    const gain=ac.createGain();
    gain.gain.setValueAtTime(0.38,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(); src.stop(ac.currentTime+dur+0.01);
  }catch(e){}
}

function playCloseCall(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    const dur=0.14;
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(360,ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(130,ac.currentTime+dur);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.22,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+dur+0.01);
  }catch(e){}
}
function playMilestone(){
  if(muted) return;
  try{
    const ac=getSfx(); if(ac.state==='suspended') ac.resume();
    [523,659,784,1047].forEach((freq,i)=>{
      const t=ac.currentTime+i*0.08;
      const osc=ac.createOscillator(); osc.type='triangle';
      osc.frequency.setValueAtTime(freq,t);
      const g=ac.createGain();
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.17,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t); osc.stop(t+0.30);
    });
  }catch(e){}
}
function unlockAudio(){
  if(audioUnlocked) return; audioUnlocked=true; getSfx();
  MENU_MUS.play().catch(()=>{});
  if(!muted) fadeAudio(MENU_MUS,MUTE_VOL*0.75,0.02);
}
function stopMenuMusic(){ fadeAudio(MENU_MUS,0,0.06); setTimeout(()=>MENU_MUS.pause(),600); }
function playGameOver(){
  OVER_MUS.currentTime=0; OVER_MUS.play().catch(()=>{});
  if(!muted) fadeAudio(OVER_MUS,MUTE_VOL,0.03);
}
function stopGameOver(){ fadeAudio(OVER_MUS,0,0.07); setTimeout(()=>OVER_MUS.pause(),500); }
function toggleMute(){
  muted=!muted;
  TRACKS.forEach(t=>{ t.volume=muted?0:(t===TRACKS[curTrack]?MUTE_VOL:0); });
  FOREST_AMB.volume=muted?0:(curTrack===0?AMBIENT_VOL:0);
  MENU_MUS.volume=muted?0:(state===S.START?MUTE_VOL*0.75:0);
  OVER_MUS.volume=muted?0:(state===S.DEAD?MUTE_VOL:0);
}
function fadeAudio(a,toVol,step){
  const id=setInterval(()=>{
    a.volume=toVol>a.volume?Math.min(toVol,a.volume+step):Math.max(toVol,a.volume-step);
    if(a.volume===toVol) clearInterval(id);
  },50);
}
function crossfadeTrack(idx){
  if(idx===curTrack) return;
  const prev=curTrack; curTrack=idx;
  // Fade out old track quickly, pause it after it's silent
  if(prev>=0){ const t=TRACKS[prev]; fadeAudio(t,0,0.07); setTimeout(()=>t.pause(),600); }
  // Delay new track start slightly so tracks don't pile up
  const n=TRACKS[idx];
  setTimeout(()=>{ n.play().catch(()=>{}); if(!muted) fadeAudio(n,MUTE_VOL,0.03); },400);
  // Forest ambient layer
  if(idx===0){ FOREST_AMB.play().catch(()=>{}); if(!muted) fadeAudio(FOREST_AMB,AMBIENT_VOL,0.02); }
  else { fadeAudio(FOREST_AMB,0,0.04); setTimeout(()=>FOREST_AMB.pause(),800); }
}

/* ── STATE ───────────────────────────────────────────────────── */
const S = {START:0,PLAY:1,DEAD:2};
let state=S.START, score=0, best=parseInt(localStorage.getItem('gauntlet_best')||'0',10), biome=0, fadeAlpha=0, curSpeed=BASE_SPEED;
let worldX=0;
let shakeAmt=0, closeCooldown=0, closeCallFlash=0;
let milestoneText='', milestoneTtl=0;
let biomeAnnName='', biomeAnnTtl=0;

/* ── SELECTABLE CHARACTERS ───────────────────────────────────── */
const CHARS = [
  {name:'Phoenix',
   body:'#c2410c',hi:'#fb923c',dark:'#7c2d12',wing:'#ea580c',whi:'#fed7aa',
   tail:'#fcd34d',thi:'#fef9c3',beak:'#fbbf24',eye:'#431407',crest:'#f97316',spark:'#fcd34d'},
  {name:'Shadow Raven',
   body:'#312e81',hi:'#818cf8',dark:'#1e1b4b',wing:'#4338ca',whi:'#a5b4fc',
   tail:'#6366f1',thi:'#e0e7ff',beak:'#c4b5fd',eye:'#0f0a1a',crest:'#7c3aed',spark:'#818cf8'},
  {name:'Storm Hawk',
   body:'#0284c7',hi:'#7dd3fc',dark:'#0369a1',wing:'#0ea5e9',whi:'#bae6fd',
   tail:'#22d3ee',thi:'#cffafe',beak:'#fbbf24',eye:'#0c4a6e',crest:'#06b6d4',spark:'#7dd3fc'},
  {name:'Forest Owl',
   body:'#4d7c0f',hi:'#a3e635',dark:'#1a2e05',wing:'#3f6212',whi:'#84cc16',
   tail:'#92400e',thi:'#fde68a',beak:'#d97706',eye:'#1a2e05',crest:'#65a30d',spark:'#a3e635'},
];
let selectedChar = parseInt(localStorage.getItem('gauntlet_char')||'0',10);
if(selectedChar<0||selectedChar>=CHARS.length) selectedChar=0;

/* ── BIRD ────────────────────────────────────────────────────── */
const bird = {x:BIRD_X,y:LH/2,vy:0,angle:0,wing:0};
function resetBird(){ Object.assign(bird,{x:BIRD_X,y:LH/2,vy:0,angle:0,wing:0}); }
function flap(){ bird.vy=JUMP_VEL; bird.wing=0; spawnMagic(); playFlap(); }
let held=false;
function updateBird(){
  bird.vy += GRAVITY;
  if(held && state===S.PLAY){ bird.vy -= HOLD_LIFT; bird.vy=Math.max(bird.vy,-3.2); }
  bird.y += bird.vy;
  const ta=(bird.vy/10)*ANG_DOWN;
  bird.angle += (Math.max(ANG_UP,Math.min(ANG_DOWN,ta))-bird.angle)*0.18;
  bird.wing = (bird.wing+0.22)%(Math.PI*2);
}

/* ── PIPES ───────────────────────────────────────────────────── */
let pipes=[], lastPipe=0;
function spawnPipe(now){
  const gap=pipeGap(score), maxT=LH-GROUND_H-gap-PIPE_MIN_H;
  const topH=PIPE_MIN_H+Math.random()*(maxT-PIPE_MIN_H);
  pipes.push({x:LW+PIPE_W, topH, botY:topH+gap, passed:false});
  lastPipe=now;
}
function updatePipes(now){
  curSpeed=pipeSpeed(score);
  if(now-lastPipe>pipeInt(score)) spawnPipe(now);
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i]; p.x-=curSpeed;
    if(!p.passed && p.x+PIPE_W<bird.x-BIRD_R){
      p.passed=true; score++;
      if([10,25,50,75,100].includes(score)){ milestoneText=score+'!'; milestoneTtl=1.0; playMilestone(); }
      if(closeCooldown<=0){
        const clearTop=bird.y-(BIRD_R-FORGIVE)-p.topH;
        const clearBot=p.botY-(bird.y+(BIRD_R-FORGIVE));
        if(clearTop<14||clearBot<14){ closeCooldown=40; closeCallFlash=1; playCloseCall(); }
      }
      const nb=biomeOf(score);
      if(nb!==biome){ biome=nb; fadeAlpha=1.0; crossfadeTrack(nb); biomeAnnName=BIOMES[nb].name.toUpperCase(); biomeAnnTtl=1.0; }
    }
    if(p.x+PIPE_W<-10) pipes.splice(i,1);
  }
}
function resetPipes(){ pipes=[]; lastPipe=0; curSpeed=BASE_SPEED; }

/* ── COLLISION ───────────────────────────────────────────────── */
function collides(){
  const r=BIRD_R-FORGIVE;
  if(bird.y+r>=LH-GROUND_H||bird.y-r<=0) return true;
  for(const p of pipes)
    if(bird.x+r>p.x&&bird.x-r<p.x+PIPE_W)
      if(bird.y-r<p.topH||bird.y+r>p.botY) return true;
  return false;
}

/* ── GROUND SCROLL ───────────────────────────────────────────── */
let gOff=0;
function updateGround(){ gOff=(gOff+curSpeed)%48; }

/* ── PARTICLES ───────────────────────────────────────────────── */
let parts=[], magic=[], embers=[], trail=[];
let lavaPhase=0, torchPhase=0;

function spawnDeath(){
  const c=CHARS[selectedChar], cols=[c.body,c.tail,c.hi,c.thi];
  const n=isMobile?14:24;
  for(let i=0;i<n;i++){
    const a=(Math.PI*2*i)/n+Math.random()*.4, sp=2+Math.random()*5;
    parts.push({x:bird.x,y:bird.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,r:3+Math.random()*5,c:cols[i%4]});
  }
}
function spawnMagic(){
  const col=CHARS[selectedChar].spark;
  const n=isMobile?4:7;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*2.5;
    magic.push({x:bird.x-8,y:bird.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,r:1.5+Math.random()*2.5,c:col});
  }
}
function updateParts(){
  lavaPhase+=0.04; torchPhase+=0.09;
  if(closeCooldown>0) closeCooldown--;
  if(closeCallFlash>0) closeCallFlash=Math.max(0,closeCallFlash-0.07);
  if(milestoneTtl>0) milestoneTtl=Math.max(0,milestoneTtl-0.020);
  if(biomeAnnTtl>0) biomeAnnTtl=Math.max(0,biomeAnnTtl-0.006);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life-=0.04;
    if(p.life<=0) parts.splice(i,1);
  }
  for(let i=magic.length-1;i>=0;i--){
    const p=magic[i]; p.x+=p.vx; p.y+=p.vy; p.vy-=0.06; p.life-=0.07;
    if(p.life<=0) magic.splice(i,1);
  }
  for(let i=embers.length-1;i>=0;i--){
    const e=embers[i]; e.x+=e.vx; e.y+=e.vy; e.vy-=0.03; e.life-=0.018;
    if(e.life<=0||e.y<0) embers.splice(i,1);
  }
  // Mobile: cap total live particles to keep frame rate stable
  if(isMobile){
    if(embers.length>18) embers.length=18;
    if(magic.length>8) magic.length=8;
  }
}
function spawnEmber(heavy){
  const rate=isMobile?(heavy?.30:.12):(heavy?.55:.22);
  if(Math.random()<rate)
    embers.push({x:Math.random()*LW,y:LH-GROUND_H-2,
      vx:(Math.random()-.5)*1.4,vy:-(1+Math.random()*2.2),
      life:1,r:1+Math.random()*2.2,c:Math.random()<.5?'#ff6600':'#ffaa00'});
}

/* ── ATMOSPHERE ──────────────────────────────────────────────── */
// Stars/fireflies for biome 1 overlay atmosphere
const STARS=[];
for(let i=0;i<60;i++) STARS.push({x:Math.random()*LW,y:Math.random()*LH*.65,
  r:.3+Math.random()*1.1,t:Math.random()*Math.PI*2,dt:.015+Math.random()*.025});
const FLIES=[];
for(let i=0;i<16;i++) FLIES.push({x:Math.random()*LW,
  y:LH*.2+Math.random()*LH*.55,ph:Math.random()*Math.PI*2,sp:.2+Math.random()*.4});

/* ── ROUNDED RECT ────────────────────────────────────────────── */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* ── CORE PARALLAX DRAW ──────────────────────────────────────── */
// Draws a tiling image layer at the given parallax depth.
// depth 0 = static, 1 = moves at same speed as pipes.
// scaleH: target height to scale image to (default = full bg area)
// anchorY: y offset to draw at (default 0)
function drawBGLayer(img, depth, scaleH, anchorY){
  if(!img) return;
  const bgH = LH - GROUND_H;
  const dstH = scaleH || bgH;
  const sc   = dstH / img.naturalHeight;
  const dstW = img.naturalWidth * sc;
  if(dstW<=0) return;
  const off = (worldX * depth) % dstW;
  const y   = anchorY || 0;
  let x = -off;
  while(x < LW + 1){
    ctx.drawImage(img, x, y, dstW, dstH);
    x += dstW;
  }
}

/* ── TORCH HELPER ────────────────────────────────────────────── */
function drawTorches(col){
  const fl=.7+.3*Math.sin(torchPhase);
  const spacing=145, tW=spacing*4, off=(worldX)%tW;
  for(let i=0;i<5;i++){
    const tx=((i*spacing-off+tW*2)%tW)-10;
    if(tx<-20||tx>LW+20) continue;
    const ty=LH*.24;
    ctx.fillStyle='#78716c'; ctx.fillRect(tx-3,ty,6,18); ctx.fillRect(tx-6,ty+13,12,4);
    const gg=ctx.createRadialGradient(tx,ty-4,0,tx,ty-4,22*fl);
    gg.addColorStop(0,col||'rgba(251,191,36,.55)'); gg.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(tx,ty-4,24*fl,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=fl; ctx.fillStyle=col||'#fbbf24';
    ctx.beginPath(); ctx.moveTo(tx,ty-18); ctx.quadraticCurveTo(tx+5,ty-9,tx,ty);
    ctx.quadraticCurveTo(tx-5,ty-9,tx,ty-18); ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawEmberLayer(){
  for(const e of embers){
    ctx.globalAlpha=e.life; ctx.fillStyle=e.c;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ── CRAGGY MOUNTAIN HELPER ──────────────────────────────────── */
// Deterministic jagged silhouette using sin harmonics — no flickering
function drawCraggyMtn(x,baseY,w,h,col,seed){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x-5,baseY+6);
  const N=18;
  for(let s=0;s<=N;s++){
    const t=s/N, px=x+t*w;
    const bell=4*t*(1-t);
    const jag=Math.sin(t*8.3+seed)*0.18
             +Math.sin(t*17.1+seed*1.6)*0.09
             +Math.sin(t*29.3+seed*0.8)*0.04;
    ctx.lineTo(Math.round(px), Math.round(baseY-h*(bell*(0.88+jag))));
  }
  ctx.lineTo(x+w+5,baseY+6);
  ctx.closePath();
  ctx.fill();
}

function drawBG2(){
  // Mossy Fortress — gothic castle interior, CC0 (ansimuz / opengameart.org)
  // Dark fill so any gaps between art layers read as deep shadow
  ctx.fillStyle='#0a0d08'; ctx.fillRect(0,0,LW,LH-GROUND_H);
  // Pan (don't tile) — these art assets aren't seamlessly repeating
  function panBG(img, rate){
    if(!img) return;
    const dH=LH-GROUND_H, sc=dH/img.naturalHeight, dW=img.naturalWidth*sc;
    const shift=Math.min(worldX*rate, Math.max(dW-LW,0));
    ctx.drawImage(img,-shift,0,dW,dH);
    if(dW<LW) ctx.drawImage(img,dW-shift,0,dW,dH); // second copy if narrower than canvas
  }
  panBG(IMGS.b2_back, 0.03); // far wall — very slow pan
  panBG(IMGS.b2_mid,  0.12); // mid arches — moderate pan
  // Foreground columns — spaced like scenery, scroll continuously left
  if(IMGS.b2_col){
    const img=IMGS.b2_col, sc=(LH-GROUND_H)/img.naturalHeight;
    const dW=Math.round(img.naturalWidth*sc), dH=LH-GROUND_H;
    const spacing=Math.round(dW*2.6);
    const base=-(worldX*0.72)%spacing - spacing;
    for(let cx=base; cx<LW+dW; cx+=spacing)
      ctx.drawImage(img, Math.round(cx), 0, dW, dH);
  }
  // Moss tint — dark green shift makes stone read as overgrown
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle='rgba(32,55,22,0.45)';
  ctx.fillRect(0,0,LW,LH-GROUND_H);
  ctx.globalCompositeOperation='source-over';
  // Moss drips from ceiling
  ctx.fillStyle='rgba(55,95,30,0.65)';
  const mOff=(worldX*0.28)%72;
  for(let mx=-mOff; mx<LW+72; mx+=72){
    const mh=10+Math.sin(mx*0.07)*5;
    ctx.fillRect(Math.round(mx),    0, 6, Math.round(mh));
    ctx.fillRect(Math.round(mx+22), 0, 4, Math.round(mh*0.55));
    ctx.fillRect(Math.round(mx+48), 0, 5, Math.round(mh*0.75));
  }
  // Ground moss glow
  const mg=ctx.createLinearGradient(0,LH-GROUND_H-45,0,LH-GROUND_H);
  mg.addColorStop(0,'rgba(30,65,12,0)'); mg.addColorStop(1,'rgba(30,65,12,0.38)');
  ctx.fillStyle=mg; ctx.fillRect(0,LH-GROUND_H-45,LW,45);
  // Ceiling vignette — deep shadow at top like a vaulted roof
  const dt=ctx.createLinearGradient(0,0,0,70);
  dt.addColorStop(0,'rgba(0,0,0,0.85)'); dt.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=dt; ctx.fillRect(0,0,LW,70);
}

    }
  } else if(biome===1){
    // Dark forest — dark soil with dead roots and low mist
    ctx.fillStyle='#0e1218'; ctx.fillRect(0,gy,LW,GROUND_H);
    ctx.fillStyle='#1a2030'; ctx.fillRect(0,gy,LW,10);
    ctx.fillStyle='#253040'; ctx.fillRect(0,gy+8,LW,2);
    // Exposed dark roots
    ctx.strokeStyle='rgba(40,50,30,0.7)'; ctx.lineWidth=2;
    for(let x=-gOff*.6;x<LW+80;x+=80){
      const rx=Math.round(x);
      ctx.beginPath(); ctx.moveTo(rx,gy+10); ctx.lineTo(rx+12,gy+28); ctx.lineTo(rx+8,gy+50); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx+40,gy+10); ctx.lineTo(rx+32,gy+35); ctx.stroke();
    }
  } else if(biome===2){
    // Mossy fortress floor — dark stone with green moss in cracks
    ctx.fillStyle='#181e14'; ctx.fillRect(0,gy,LW,GROUND_H);
    ctx.fillStyle='#2a3422'; ctx.fillRect(0,gy,LW,8);
    ctx.fillStyle='#3a4a2c'; ctx.fillRect(0,gy+6,LW,2);
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1;
    for(let x=-gOff;x<LW+48;x+=48){
      ctx.strokeRect(Math.round(x),gy+8,48,GROUND_H-8);
      ctx.fillStyle='rgba(50,90,30,0.35)';
      ctx.fillRect(Math.round(x)+2,gy+8,6,3);
    }
  } else if(biome===3){
    ctx.fillStyle='#0c0500'; ctx.fillRect(0,gy,LW,GROUND_H);
    const lsg=ctx.createLinearGradient(0,gy,0,gy+22);
    lsg.addColorStop(0,`rgba(255,${80+30*Math.sin(lavaPhase*2)},0,0.95)`);
    lsg.addColorStop(1,'rgba(120,20,0,0)');
    ctx.fillStyle=lsg;
    ctx.beginPath(); ctx.moveTo(-5,gy+22);
    for(let wx=0;wx<=LW+8;wx+=6)
      ctx.lineTo(wx,gy+8+Math.sin(wx*0.05+lavaPhase*3)*4+Math.sin(wx*0.12+lavaPhase*2)*2);
    ctx.lineTo(LW+5,gy+22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=`rgba(255,69,0,${.55+.35*Math.sin(lavaPhase)})`; ctx.lineWidth=2;
    for(let x=-gOff;x<LW+60;x+=60){
      ctx.beginPath();
      ctx.moveTo(x,gy+4); ctx.lineTo(x+18,gy+14);
      ctx.lineTo(x+34,gy+7); ctx.lineTo(x+54,gy+18); ctx.stroke();
    }
  } else {
    const hf=ctx.createLinearGradient(0,gy,0,gy+GROUND_H);
    hf.addColorStop(0,'#7f1d1d'); hf.addColorStop(1,'#450a0a');
    ctx.fillStyle=hf; ctx.fillRect(0,gy,LW,GROUND_H);
    const lsg2=ctx.createLinearGradient(0,gy,0,gy+22);
    lsg2.addColorStop(0,`rgba(255,${70+40*Math.sin(lavaPhase*2)},0,0.92)`);
    lsg2.addColorStop(1,'rgba(180,20,0,0)');
    ctx.fillStyle=lsg2;
    ctx.beginPath(); ctx.moveTo(-5,gy+22);
    for(let wx=0;wx<=LW+8;wx+=6)
      ctx.lineTo(wx,gy+7+Math.sin(wx*0.04+lavaPhase*2.5)*5+Math.sin(wx*0.10+lavaPhase*1.8)*2);
    ctx.lineTo(LW+5,gy+22); ctx.closePath(); ctx.fill();
  }
}

/* pixel art brick helper — draws mortar + offset brick rows */
function drawBricks(bx,by,bw,bh,mainCol,hiCol,mortarCol){
  if(bh<=0||bw<=0) return;
  ctx.fillStyle=mortarCol; ctx.fillRect(bx,by,bw,bh);
  const BW=14,BH=9;
  for(let r=0; r*BH<bh+BH; r++){
    const ox=(r%2)*(BW/2);
    for(let c=-1; c*BW<bw+BW; c++){
      const x1=Math.max(Math.round(bx+c*BW+ox)+1,bx);
      const y1=Math.max(Math.round(by+r*BH)+1,by);
      const x2=Math.min(Math.round(bx+c*BW+ox)+BW-1,bx+bw);
      const y2=Math.min(Math.round(by+r*BH)+BH-1,by+bh);
      if(x2>x1&&y2>y1){
        ctx.fillStyle=mainCol; ctx.fillRect(x1,y1,x2-x1,y2-y1);
        ctx.fillStyle=hiCol;   ctx.fillRect(x1,y1,x2-x1,2);
      }
    }
  }
}
function drawForestPillar({x,topH,botY}){
  const sp=biome===1;
  const fc=sp?'#c084fc':'#fbbf24', gc=sp?'rgba(180,80,240,0.45)':'rgba(255,185,50,0.55)';
  const botH=LH-GROUND_H-botY;
  const stemC=sp?'#2a3a1e':'#3a5c22', leafC=sp?'#2a4a18':'#4a8a2c', leafH=sp?'#3a5a28':'#6aaa40';
  const logC=sp?'#3a2840':'#6b4c2a', logH=sp?'#5a4860':'#8b6c4a', logD=sp?'#1e1428':'#3a2810';

  // ── TOP: vine-wrapped column ──────────────────────────────────
  ctx.fillStyle=sp?'#181424':'#1e2a14'; ctx.fillRect(x,0,PIPE_W,topH-14);
  for(let vi=0;vi<3;vi++){
    const sx=x+8+vi*16; ctx.fillStyle=stemC;
    for(let vy=0;vy<topH-14;vy+=3){
      ctx.fillRect(sx+Math.round(Math.sin(vy*0.15+vi*2)*2),vy,2,3);
    }
  }
  [[x+3,topH*0.12,10,6],[x+30,topH*0.27,9,5],[x+10,topH*0.48,12,6],[x+36,topH*0.63,8,5],[x+6,topH*0.79,11,6]]
    .forEach(([rx,ry,rw,rh])=>{
      ctx.fillStyle=leafC; ctx.fillRect(rx,ry,rw,rh);
      ctx.fillStyle=leafH; ctx.fillRect(rx,ry,rw,2);
    });
  ctx.fillStyle=logC; ctx.fillRect(x-5,topH-14,PIPE_W+10,14);
  ctx.fillStyle=logH; ctx.fillRect(x-5,topH-14,PIPE_W+10,3);
  ctx.fillStyle=logD; ctx.fillRect(x-5,topH-2,PIPE_W+10,2);
  for(let vt=0;vt<5;vt++){
    const vtx=x+5+vt*11;
    const vtLen=10+(vt%3)*7+Math.round(Math.sin(torchPhase+vt*1.3)*2);
    ctx.fillStyle=stemC;
    for(let vy=0;vy<vtLen;vy+=2){
      ctx.fillRect(vtx+Math.round(Math.sin(torchPhase+vt*1.3+vy*0.2)*1.5),topH+vy,2,2);
    }
    ctx.fillStyle=leafC; ctx.fillRect(vtx-3,topH+vtLen,8,4);
  }
  drawCapLantern(x+PIPE_W/2,topH,fc,gc);

  // ── BOTTOM: pixel art tree ────────────────────────────────────
  if(sp){
    // Narrower gnarled trunk
    const tw=14, tx=x+(PIPE_W-tw)/2;

    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(tx+tw-3,botY,3,botH);
    ctx.fillStyle='#100c16';
    for(let by=botY+8;by<LH-GROUND_H;by+=18){ ctx.fillRect(tx+4,by,5,2); ctx.fillRect(tx+3,by+9,4,2); }
    // Dark foliage crown — 4 stacked spooky tiers, widest at bottom
    const fCol=['#0a1808','#0f2010','#142814','#1a3018'];
    const fHi=['#14200c','#1a2c14','#20381a','#284420'];
    for(let fl=0;fl<4;fl++){
      const fw=PIPE_W+18-fl*8, fx2=x+(PIPE_W-fw)/2;
      const fy=botY-8-fl*16;
      ctx.fillStyle=fCol[fl];
      ctx.fillRect(fx2,fy+9,fw,13);
      ctx.beginPath(); ctx.moveTo(fx2+fw/2,fy); ctx.lineTo(fx2+fw,fy+11); ctx.lineTo(fx2,fy+11); ctx.fill();
      ctx.fillStyle=fHi[fl]; ctx.fillRect(fx2,fy+9,fw,2);
    }
    // Bare branch tips poking from crown sides
    ctx.strokeStyle='#221828'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x-2,botY-12); ctx.lineTo(x-18,botY-34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+PIPE_W+2,botY-10); ctx.lineTo(x+PIPE_W+18,botY-28); ctx.stroke();
    ctx.lineWidth=1;
    // Cobweb
    ctx.strokeStyle='rgba(140,130,160,0.25)';
    ctx.beginPath(); ctx.moveTo(x-14,botY-30); ctx.lineTo(x+4,botY-10); ctx.stroke();
  } else {
    const tw=18, tx=x+(PIPE_W-tw)/2;
    ctx.fillStyle='#5c3a1a'; ctx.fillRect(tx,botY,tw,botH);
    ctx.fillStyle='#7c5a2a'; ctx.fillRect(tx,botY,4,botH);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(tx+tw-3,botY,3,botH);
    ctx.fillStyle='#3a2010';
    for(let by=botY+10;by<LH-GROUND_H;by+=20){ ctx.fillRect(tx+5,by,8,2); ctx.fillRect(tx+4,by+10,6,2); }
    const fC=['#1e5c0e','#2d7a18','#3d8e28'];
    for(let fl=0;fl<3;fl++){
      const fy=botY-10-fl*18, fw=PIPE_W+14-fl*10, fx=x+(PIPE_W-fw)/2;
      ctx.fillStyle=fC[fl]; ctx.fillRect(fx,fy+8,fw,14);
      ctx.beginPath(); ctx.moveTo(fx+fw/2,fy); ctx.lineTo(fx+fw,fy+10); ctx.lineTo(fx,fy+10); ctx.fill();
      ctx.fillStyle='#5ab030'; ctx.fillRect(fx,fy+8,fw,2);
    }
    ctx.fillStyle='#fbbf24';
    [[x+4,botY-6],[x+PIPE_W-8,botY-9],[x+PIPE_W/2-3,botY-3]].forEach(([px,py])=>ctx.fillRect(px,py,3,3));
  }
}

function drawLavaPillar({x,topH,botY}){

  ctx.fillStyle='#9b3200'; ctx.fillRect(x-cO,topH-12,PIPE_W+cO*2,3);
  ctx.fillStyle='#3b1000'; ctx.fillRect(x-cO,topH-2,PIPE_W+cO*2,2);
  [[x+PIPE_W/2,30,11],[x+10,20,8],[x+PIPE_W-10,24,8],[x+3,12,5],[x+PIPE_W-3,14,5]]
    .forEach(([cx,len,w])=>{

  ctx.strokeStyle=cr2; ctx.lineWidth=1.5;

    .forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  drawCapTorch(x+PIPE_W/2,botY,'#ff7700','rgba(255,100,0,0.65)');

function drawHellPillar({x,topH,botY}){
  const cO=6,cH=22,botH=LH-GROUND_H-botY;
  const glow=`rgba(255,45,0,${0.14+0.1*Math.sin(lavaPhase)})`;

      ctx.fillStyle='#5c1010'; ctx.fillRect(cx-Math.floor(w/2),topH,2,len-5);

      gg.addColorStop(0,'rgba(255,40,0,0.55)'); gg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cx,topH+len+2,7,0,Math.PI*2); ctx.fill();
    });
  pillarFlames(x,PIPE_W,cO,topH,false);

  drawBricks(x,botY+cH,PIPE_W,botH-cH,'#4a0f0f','#6b1a1a','#1e0404');
  pillarFlames(x,PIPE_W,cO,botY+cH,true);
  drawCapTorch(x+PIPE_W/2,botY,'#ff3300','rgba(255,40,0,0.70)');
}
let fph=0;
function pillarFlames(x,w,cO,y,up){
  fph+=0.04;
  for(let i=0;i<5;i++){
    const fx=x-cO+(w+cO*2)/4*i+Math.sin(fph+i)*3;
    const fh=14+6*Math.abs(Math.sin(fph+i*.7));
    ctx.globalAlpha=.65+.35*Math.sin(fph+i);
    ctx.fillStyle=i%2===0?'#ff6600':'#ffaa00';
    ctx.beginPath();
    if(!up){ctx.moveTo(fx,y);ctx.quadraticCurveTo(fx+4,y+fh/2,fx,y+fh);ctx.quadraticCurveTo(fx-4,y+fh/2,fx,y);}
    else   {ctx.moveTo(fx,y);ctx.quadraticCurveTo(fx+4,y-fh/2,fx,y-fh);ctx.quadraticCurveTo(fx-4,y-fh/2,fx,y);}
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ── BIRD DRAW (pixel art) ───────────────────────────────────── */
function drawBird(){
  const c=CHARS[selectedChar];
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.angle*Math.PI/180);
  const wo=Math.round(Math.sin(bird.wing)*5); // wing flap offset

  // Flame trail biome 3+
  if(biome>=3){
    for(let i=0;i<5;i++){
      ctx.globalAlpha=(1-i/5)*.85;
      ctx.fillStyle=biome>=4?'#ff2200':'#ff8800';
      ctx.fillRect(-15-i*6, Math.round(Math.sin(bird.wing+i)*3)-3, 5, 6);
    }
    ctx.globalAlpha=1;
  }

  // Tail — 3 stacked pixel feather bars
  ctx.fillStyle=c.thi; ctx.fillRect(-26,-6,14,4);
  ctx.fillStyle=c.tail; ctx.fillRect(-24,-2,16,4);
  ctx.fillStyle=c.thi; ctx.fillRect(-26,2,14,4);
  ctx.fillStyle=c.dark; ctx.fillRect(-14,-2,2,4); // root shadow

  // Wing (behind body, animates up/down)
  ctx.fillStyle=c.wing; ctx.fillRect(-8,-12+wo,20,8);
  ctx.fillStyle=c.whi;  ctx.fillRect(-6,-12+wo,16,4);
  // Feather tips row
  for(let i=0;i<4;i++){
    ctx.fillStyle=i%2===0?c.wing:c.whi;
    ctx.fillRect(-6+i*4,-15+wo,4,4);
  }

  // Body
  ctx.fillStyle=c.body; ctx.fillRect(-10,-8,20,16);
  ctx.fillStyle=c.hi;   ctx.fillRect(-8,-8,16,4);   // top highlight row
  ctx.fillStyle=c.dark; ctx.fillRect(-10,6,20,2);    // bottom shadow row
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.fillRect(-10,-2,2,8); ctx.fillRect(8,-2,2,8); // side depth

  // Head
  ctx.fillStyle=c.body; ctx.fillRect(8,-14,14,14);
  ctx.fillStyle=c.hi;   ctx.fillRect(8,-14,14,4);   // head top highlight
  ctx.fillRect(8,-10,4,10);                          // left edge highlight

  // Crest — stepped pixel spikes
  ctx.fillStyle=c.crest;
  ctx.fillRect(10,-20,4,8);
  ctx.fillRect(14,-18,4,6);
  ctx.fillRect(18,-15,4,4);

  // Eye socket + pupil + shine
  ctx.fillStyle='#ffffff'; ctx.fillRect(16,-10,8,6);
  ctx.fillStyle=c.eye;    ctx.fillRect(18,-10,4,4);
  ctx.fillStyle='#ffffff'; ctx.fillRect(20,-10,2,2); // pixel shine

  // Beak — two pixel bars forming open/closed triangle
  ctx.fillStyle=c.beak;
  ctx.fillRect(22,-8,10,4);   // upper mandible
  ctx.fillRect(22,-4,8,4);    // lower mandible
  ctx.fillStyle=c.hi;
  ctx.fillRect(22,-8,10,2);   // beak highlight

  ctx.restore();
}

/* ── TRAIL ───────────────────────────────────────────────────── */
function spawnTrail(){
  const c=CHARS[selectedChar];
  const rate=isMobile?0.45:0.70;
  if(Math.random()<rate)
    trail.push({x:bird.x-14,y:bird.y+2+(Math.random()-.5)*8,
      vx:-(0.5+Math.random()*0.8),vy:(Math.random()-.5)*0.8,
      life:1,r:1+Math.random()*2.2,c:c.spark});
}
function updateTrail(){
  for(let i=trail.length-1;i>=0;i--){
    const t=trail[i]; t.x+=t.vx; t.y+=t.vy; t.life-=0.07;
    if(t.life<=0) trail.splice(i,1);
  }
  if(isMobile && trail.length>12) trail.length=12;
}
function drawTrail(){
  for(const t of trail){
    ctx.globalAlpha=t.life*0.65;
    ctx.fillStyle=t.c;
    const sz=Math.max(1,Math.round(t.r*t.life));
    ctx.fillRect(Math.round(t.x-sz/2),Math.round(t.y-sz/2),sz,sz);
  }
  ctx.globalAlpha=1;
}

/* ── PARTICLES ───────────────────────────────────────────────── */
function drawParts(){
  for(const p of [...parts,...magic]){
    ctx.globalAlpha=p.life; ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawCloseCallFlash(){

function drawMilestonePop(){
  if(milestoneTtl<=0) return;
  const a=milestoneTtl<0.25?milestoneTtl/0.25:1;
  const py=Math.round(LH/2-60-18*(1-milestoneTtl));
  ctx.save(); ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 40px Georgia';
  ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=6;
  ctx.strokeText(milestoneText,LW/2,py);
  ctx.fillStyle='#fbbf24'; ctx.fillText(milestoneText,LW/2,py);
  ctx.restore();
}
function drawBiomeAnn(){
  if(biomeAnnTtl<=0) return;
  const a=biomeAnnTtl>0.85?(1-biomeAnnTtl)*6.7:biomeAnnTtl<0.2?biomeAnnTtl*5:1;
  const py=Math.round(LH/2-biomeAnnTtl*35);
  ctx.save(); ctx.globalAlpha=Math.min(1,a)*0.92;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 18px Georgia';
  ctx.strokeStyle='rgba(0,0,0,0.75)'; ctx.lineWidth=5;
  ctx.strokeText('— '+biomeAnnName+' —',LW/2,py);
  ctx.fillStyle='#c4b5fd'; ctx.fillText('— '+biomeAnnName+' —',LW/2,py);
  ctx.restore();
}

/* ── IDLE ────────────────────────────────────────────────────── */
function idleBird(now){
  bird.y=LH/2+Math.sin(now/380)*9;
  bird.angle=Math.sin(now/380)*7;
  bird.wing=(bird.wing+0.09)%(Math.PI*2);
  if(Math.random()<0.06) spawnMagic();
}

/* ── PANELS & BUTTONS ────────────────────────────────────────── */
function panel(cx,cy,w,h){
  const x=cx-w/2,y=cy-h/2;
  ctx.fillStyle='rgba(0,0,0,.6)'; rr(x+4,y+4,w,h,16); ctx.fill();
  const pg=ctx.createLinearGradient(x,y,x,y+h);
  pg.addColorStop(0,'rgba(25,10,55,.96)'); pg.addColorStop(1,'rgba(10,3,22,.96)');
  ctx.fillStyle=pg; rr(x,y,w,h,16); ctx.fill();
  ctx.strokeStyle='rgba(167,139,250,.6)'; ctx.lineWidth=2; rr(x,y,w,h,16); ctx.stroke();
  ctx.strokeStyle='rgba(167,139,250,.18)'; ctx.lineWidth=1; rr(x+3,y+3,w-6,h-6,14); ctx.stroke();
}
function btn(cx,y,w,h,lbl,c1,c2){
  const x=cx-w/2;
  ctx.fillStyle='rgba(0,0,0,.32)'; rr(x+3,y+3,w,h,h/2); ctx.fill();
  const bg=ctx.createLinearGradient(cx,y,cx,y+h);
  bg.addColorStop(0,c1); bg.addColorStop(1,c2);
  ctx.fillStyle=bg; rr(x,y,w,h,h/2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)'; rr(x+4,y+3,w-8,h/2,h/2-2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 19px Georgia';
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=4;
  ctx.fillText(lbl,cx,y+h/2); ctx.shadowBlur=0;
}

/* ── START SCREEN ────────────────────────────────────────────── */
function drawStart(now){
  const pulse=0.7+0.3*Math.sin(now/500), cy=LH/2-8;
  panel(LW/2,cy,348,375);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 34px Georgia'; ctx.strokeStyle='#1a0050'; ctx.lineWidth=5;
  ctx.strokeText('⚔  THE GAUNTLET  ⚔',LW/2,cy-128);
  const tg=ctx.createLinearGradient(0,cy-145,0,cy-110);
  tg.addColorStop(0,'#fbbf24'); tg.addColorStop(1,'#f59e0b');
  ctx.fillStyle=tg; ctx.fillText('⚔  THE GAUNTLET  ⚔',LW/2,cy-128);
  ctx.font='bold 15px Georgia'; ctx.fillStyle='#c4b5fd';
  ctx.fillText('How far can you go?',LW/2,cy-98);
  ctx.strokeStyle='rgba(167,139,250,.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(LW/2-125,cy-82); ctx.lineTo(LW/2+125,cy-82); ctx.stroke();
  ctx.font='12px Georgia'; ctx.fillStyle='#a78bfa';
  ctx.fillText('Journey through 5 realms:',LW/2,cy-66);
  ['🌲 Sunlit Forest','🌑 Dark Forest','🏰 Mossy Fortress','🌋 Lava Cavern','☠ Volcanic Hellscape']
    .forEach((r,i)=>{ ctx.font='11px Georgia'; ctx.fillStyle='#7c3aed'; ctx.fillText(r,LW/2,cy-51+i*14); });
  ctx.strokeStyle='rgba(167,139,250,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(LW/2-125,cy+22); ctx.lineTo(LW/2+125,cy+22); ctx.stroke();
  ctx.font='bold 11px Georgia'; ctx.fillStyle='#a78bfa';
  ctx.fillText('CHOOSE YOUR CHAMPION',LW/2,cy+35);
  const charXs=[LW/2-90,LW/2-30,LW/2+30,LW/2+90];
  for(let i=0;i<CHARS.length;i++) drawMiniChar(charXs[i],cy+62,i,i===selectedChar);
  ctx.textBaseline='middle';
  if(best>0){ ctx.font='14px Georgia'; ctx.fillStyle='#fbbf24'; ctx.fillText('Best: '+best+' pipes',LW/2,cy+100); }
  ctx.font='12px Georgia'; ctx.fillStyle='#4b5563';
  ctx.fillText(isMobile?'Tap & hold to float':'SPACE or click & hold to float',LW/2,cy+112);
  ctx.globalAlpha=pulse;
  btn(LW/2,cy+130,224,52,'⚔  BEGIN QUEST','#7c3aed','#4c1d95');
  ctx.globalAlpha=1;
}

/* ── GAME OVER ───────────────────────────────────────────────── */
function drawDead(){
  const cy=LH/2-8;
  ctx.fillStyle='rgba(0,0,0,0.48)'; ctx.fillRect(0,0,LW,LH);
  panel(LW/2,cy,348,375);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 42px Georgia'; ctx.strokeStyle='#7f0000'; ctx.lineWidth=5;
  ctx.strokeText('YOU DIED',LW/2,cy-128);
  const tg=ctx.createLinearGradient(0,cy-150,0,cy-106);
  tg.addColorStop(0,'#ff4444'); tg.addColorStop(1,'#b71c1c');
  ctx.fillStyle=tg; ctx.fillText('YOU DIED',LW/2,cy-128);
  ctx.font='14px Georgia'; ctx.fillStyle='#c4b5fd';
  ctx.fillText('Realm reached: '+BIOMES[biome].name,LW/2,cy-96);
  ctx.strokeStyle='rgba(167,139,250,.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(LW/2-115,cy-78); ctx.lineTo(LW/2+115,cy-78); ctx.stroke();
  ctx.font='15px Georgia'; ctx.fillStyle='#9ca3af';
  ctx.fillText('PIPES',LW/2-70,cy-56); ctx.fillText('BEST',LW/2+70,cy-56);
  ctx.font='bold 40px Georgia'; ctx.fillStyle='#e2e8f0';
  ctx.fillText(score,LW/2-70,cy-14);
  ctx.fillStyle='#fbbf24'; ctx.fillText(best,LW/2+70,cy-14);
  if(score===best&&score>0){ ctx.font='bold 13px Georgia'; ctx.fillStyle='#fbbf24'; ctx.fillText('✦  NEW RECORD!  ✦',LW/2,cy+24); }
  ctx.strokeStyle='rgba(167,139,250,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(LW/2-115,cy+38); ctx.lineTo(LW/2+115,cy+38); ctx.stroke();
  ctx.font='bold 11px Georgia'; ctx.fillStyle='#a78bfa';
  ctx.fillText('CHOOSE YOUR CHAMPION',LW/2,cy+50);
  const charXs=[LW/2-90,LW/2-30,LW/2+30,LW/2+90];
  for(let i=0;i<CHARS.length;i++) drawMiniChar(charXs[i],cy+72,i,i===selectedChar);
  ctx.textBaseline='middle';
  btn(LW/2,cy+106,234,52,'↺  TRY AGAIN','#7c3aed','#4c1d95');
  const tips=['Hold Space to float!','Gaps are wide early – find your rhythm','Speed grows as you progress','Can you reach the Hellscape?'];
  ctx.font='13px Georgia'; ctx.fillStyle='#4b5563';
  ctx.fillText(tips[score%tips.length],LW/2,cy+170);
}

/* ── LOADING SCREEN ──────────────────────────────────────────── */
function drawLoading(){
  ctx.fillStyle='#0a0010'; ctx.fillRect(0,0,LW,LH);
  const pct = imgsLoaded/imgsTotal;
  // Bar
  ctx.fillStyle='rgba(167,139,250,0.2)';
  ctx.fillRect(LW/2-120,LH/2-8,240,16);
  ctx.fillStyle='#7c3aed';
  ctx.fillRect(LW/2-120,LH/2-8,240*pct,16);
  ctx.strokeStyle='rgba(167,139,250,0.5)'; ctx.lineWidth=1;
  ctx.strokeRect(LW/2-120,LH/2-8,240,16);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 14px Georgia'; ctx.fillStyle='#c4b5fd';
  ctx.fillText('Loading realms…  '+Math.round(pct*100)+'%', LW/2, LH/2+26);
  ctx.font='bold 28px Georgia'; ctx.fillStyle='#fbbf24';
  ctx.fillText('⚔  THE GAUNTLET  ⚔', LW/2, LH/2-50);
}

/* ── MAIN LOOP ───────────────────────────────────────────────── */
function loop(now){
  requestAnimationFrame(loop);
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,LW,LH);
  if(shakeAmt>0){
    const sx=Math.round((Math.random()-.5)*shakeAmt*2.2);
    const sy=Math.round((Math.random()-.5)*shakeAmt*1.8);
    ctx.setTransform(scale,0,0,scale,sx*scale,sy*scale);
    shakeAmt=Math.max(0,shakeAmt-0.55);
  }

  if(imgsLoaded < imgsTotal){ drawLoading(); return; }

  worldX += state===S.PLAY ? curSpeed : 0.35;

  if(biome===0)      drawBG0();
  else if(biome===1) drawBG1();
  else if(biome===2) drawBG2();
  else if(biome===3) drawBG3();
  else               drawBG4();

  if(fadeAlpha>0){
    ctx.fillStyle=`rgba(0,0,0,${fadeAlpha})`;
    ctx.fillRect(0,0,LW,LH);
    fadeAlpha=Math.max(0,fadeAlpha-.022);
  }

  if(state===S.START){
    idleBird(now); updateParts();
    drawGround(); drawParts(); drawBird(); drawStart(now); drawMuteBtn();
  } else if(state===S.PLAY){
    updateBird(); updatePipes(now); updateGround(); updateParts(); spawnTrail(); updateTrail();
    drawPipes(); drawGround(); drawParts(); drawTrail(); drawBird(); drawScore(); drawFlash(); drawCloseCallFlash(); drawMilestonePop(); drawBiomeAnn();
    if(collides()) die();
  } else {
    updateGround(); updateParts(); updateTrail();
    drawPipes(); drawGround(); drawParts(); drawTrail(); drawBird(); drawScore(); drawFlash(); drawDead();
  }
}

/* ── GAME EVENTS ─────────────────────────────────────────────── */
function die(){
  state=S.DEAD; flash=1; shakeAmt=9; best=Math.max(best,score);
  localStorage.setItem('gauntlet_best',best);
  if(curTrack>=0){ fadeAudio(TRACKS[curTrack],0,0.06); setTimeout(()=>TRACKS[curTrack].pause(),700); }
  fadeAudio(FOREST_AMB,0,0.05); setTimeout(()=>FOREST_AMB.pause(),700);
  curTrack=-1;
  playGameOver();
  spawnDeath(); bird.vy=0; bird.angle=75; trail=[];
}
function go(){
  playClick();
  score=0; state=S.PLAY; held=false; biome=0; fadeAlpha=0;
  embers=[]; parts=[]; magic=[]; trail=[];
  shakeAmt=0; milestoneTtl=0; biomeAnnTtl=0; closeCallFlash=0;
  lastPipe=performance.now()-(BASE_INTERVAL-950);
  stopMenuMusic(); stopGameOver();
  crossfadeTrack(0);
  resetBird(); resetPipes(); flap();
}
function input(){
  unlockAudio();
  if(state===S.START||state===S.DEAD) go(); else flap();
}
document.addEventListener('keydown',e=>{
  if(e.code==='KeyM'){ e.preventDefault(); toggleMute(); return; }
  if(e.code==='Space'||e.key==='ArrowUp'){ e.preventDefault(); if(!e.repeat) input(); held=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.key==='ArrowUp') held=false;
});
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const cx=e.offsetX/scale, cy=e.offsetY/scale;
  if(muteHit(cx,cy)){ toggleMute(); playClick(); return; }
  if(state===S.START||state===S.DEAD){
    const rowY=(LH/2-8)+(state===S.DEAD?72:62);
    const charXs=[LW/2-90,LW/2-30,LW/2+30,LW/2+90];
    for(let i=0;i<CHARS.length;i++){
      if(Math.abs(cx-charXs[i])<22&&Math.abs(cy-rowY)<22){
        selectedChar=i; localStorage.setItem('gauntlet_char',i); playClick(); return;
      }
    }
  }
  held=true; input();
});
canvas.addEventListener('pointerup',()=>held=false);
canvas.addEventListener('pointerleave',()=>held=false);

requestAnimationFrame(loop);
})();
</script>
